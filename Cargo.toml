[workspace]
members = [
    "crates/ca-core",
    "crates/ca-streams",
    "crates/ca-app",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["CRV Science / Clean-Room Systems Biology Contributors"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
rayon = "1.10"
thiserror = "1.0"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
ureq = { version = "2.10", default-features = false, features = ["tls", "json", "gzip"] }
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wgpu", "persistence", "wayland", "x11"] }
egui = "0.29"
ratatui = "0.28"
crossterm = "0.28"
rfd = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
