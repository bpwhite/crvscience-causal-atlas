name: Causal Atlas Pure-Rust CI

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test-and-lint:
    name: Workspace Check & Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install Linux windowing headers (X11/Wayland)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
      - name: Verify zero unsafe & clippy clean
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run statistical & stream parser test suites
        run: cargo test --workspace
      - name: Build release standalone binary
        run: cargo build --release -p ca-app
